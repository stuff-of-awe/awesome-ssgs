name: "00 - SSG catalogue tests"

on:
  push:
    branches: [main]
  pull_request:  # Every PR: referenced assets outside docs may be deleted or renamed.

permissions:
  contents: read

jobs:
  catalogue:
    name: "00 - catalogue checks (local)"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout (pinned GitHub action)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate catalogue and local targets
        run: node scripts/check-catalogue.mjs
      - name: Exercise positive and negative controls
        run: node --test tests/*.test.mjs
